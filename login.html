<!DOCTYPE html>
<html lang="en" data-page="login">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Hex & Stitch</title>
<style>
  @font-face {
    font-family: 'Bloodcrow';
    src: url('https://cdn.jsdelivr.net/gh/furdecimbit/voodoo-generator@main/bloodcrowc.ttf') format('truetype');
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #080608;
    color: #e8d09a;
    font-family: 'Bloodcrow', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Smoke */
  #smoke-container { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .smoke-particle {
    position:absolute; border-radius:50%; opacity:0;
    animation: smokeRise linear infinite;
  }
  @keyframes smokeRise {
    0%   { transform:translateY(0) scale(0.5); opacity:0; }
    15%  { opacity:0.12; }
    80%  { opacity:0.07; }
    100% { transform:translateY(-80vh) scale(2.5); opacity:0; }
  }

  /* Card */
  #login-card {
    position: relative; z-index: 10;
    width: min(420px, calc(100vw - 32px));
    background: linear-gradient(160deg, #1a0e1a, #0e080e);
    border: 1px solid #3a1a3a;
    border-radius: 20px;
    padding: 40px 36px;
    box-shadow: 0 0 60px #6030a022;
    display: flex; flex-direction: column; gap: 28px;
  }

  /* Logo */
  #logo-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  #logo-wrap img { height: 48px; opacity: .85; }
  #logo-title {
    font-size: 32px; letter-spacing: .2em; text-transform: uppercase;
    color: #e8c060; text-shadow: 0 0 24px #e8a02055;
  }
  #logo-sub {
    font-size: 13px; color: #5a4020; letter-spacing: .1em; text-transform: uppercase;
  }

  /* Tabs */
  #tabs {
    display: flex; border-bottom: 1px solid #2a1a2a; gap: 0;
  }
  .tab-btn {
    flex: 1; padding: 10px; background: none; border: none;
    font-family: 'Bloodcrow', serif; font-size: 16px;
    letter-spacing: .1em; text-transform: uppercase;
    color: #4a3040; cursor: pointer; transition: color .2s;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab-btn.active { color: #e8c060; border-bottom-color: #e8c060; }

  /* Form */
  #form-wrap { display: flex; flex-direction: column; gap: 14px; }

  .field-group { display: flex; flex-direction: column; gap: 6px; }
  .field-label {
    font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #6a5030;
  }
  .field-input {
    padding: 12px 16px;
    background: #130a13; border: 1px solid #3a1a3a; border-radius: 10px;
    color: #e8d09a; font-family: 'Bloodcrow', serif; font-size: 16px;
    letter-spacing: .06em; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .field-input:focus {
    border-color: #8040a0;
    box-shadow: 0 0 12px #8040a033;
  }

  #submit-btn {
    padding: 14px;
    background: linear-gradient(135deg, #6030a0, #3a1060);
    border: 1px solid #8040c0; border-radius: 12px;
    color: #e8d0ff; font-family: 'Bloodcrow', serif;
    font-size: 20px; letter-spacing: .14em; text-transform: uppercase;
    cursor: pointer; margin-top: 4px;
    transition: transform .15s, box-shadow .2s;
    box-shadow: 0 0 24px #6030a044;
  }
  #submit-btn:hover { transform: scale(1.02); box-shadow: 0 0 36px #8050c066; }
  #submit-btn:disabled { opacity: .5; cursor: default; transform: none; }

  #error-msg {
    font-size: 13px; color: #e05050; letter-spacing: .06em;
    text-align: center; min-height: 18px;
    animation: fadeIn .3s ease;
  }
  #success-msg {
    font-size: 14px; color: #50c070; letter-spacing: .08em;
    text-align: center; display: none;
    animation: fadeIn .3s ease;
  }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

  /* Spinner */
  .btn-spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid #6040a0; border-top-color: #e8d0ff;
    border-radius: 50%; animation: spin .6s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #home-link {
    text-align: center; font-size: 12px; color: #4a3020;
    letter-spacing: .08em; text-transform: uppercase;
    text-decoration: none; transition: color .2s;
  }
  #home-link:hover { color: #c8a040; }

  /* Witch name preview (signup) */
  #witchname-preview {
    display: none; text-align: center;
    font-size: 13px; color: #7a5030; letter-spacing: .08em;
    text-transform: uppercase;
  }
  #witchname-preview span { color: #c8a060; }
</style>
</head>
<body>

<div id="smoke-container"></div>

<div id="login-card">

  <div id="logo-wrap">
    <img src="logo.png" alt="Hex & Stitch" onerror="this.style.display='none'">
    <div id="logo-title">Hex & Stitch</div>
    <div id="logo-sub">Enter the ritual</div>
  </div>

  <div id="tabs">
    <button class="tab-btn active" onclick="switchTab('login')">Sign In</button>
    <button class="tab-btn" onclick="switchTab('signup')">Create Account</button>
  </div>

  <div id="form-wrap">
    <div class="field-group">
      <div class="field-label">Username</div>
      <input class="field-input" id="input-username" type="text" placeholder="your username" autocomplete="username" autocapitalize="none">
    </div>
    <div class="field-group">
      <div class="field-label">Password</div>
      <input class="field-input" id="input-password" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div id="witchname-preview">Your witch name will be: <span id="wn-sample"></span></div>
    <div id="error-msg"></div>
    <button id="submit-btn" onclick="handleSubmit()">Sign In</button>
    <div id="success-msg"></div>
  </div>

  <a id="home-link" href="index.html">← Back to Home</a>

</div>

<script>
const WIX_API = 'https://www.alperozdil.com/_functions';
let currentTab = 'login';

// ── Smoke ──
(function buildSmoke(){
  const c = document.getElementById('smoke-container');
  const colors = ['#c8a040','#6a4010','#8040a0'];
  for(let i=0;i<14;i++){
    const p = document.createElement('div');
    p.className = 'smoke-particle';
    const size = 80 + Math.random()*200;
    p.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;bottom:${-size}px;background:radial-gradient(circle,${colors[i%colors.length]}14 0%,transparent 70%);animation-duration:${7+Math.random()*9}s;animation-delay:${Math.random()*8}s;`;
    c.appendChild(p);
  }
})();

// ── Tabs ──
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    btn.classList.toggle('active', (i===0 && tab==='login') || (i===1 && tab==='signup'));
  });
  document.getElementById('submit-btn').textContent = tab === 'login' ? 'Sign In' : 'Create Account';
  document.getElementById('error-msg').textContent = '';
  document.getElementById('success-msg').style.display = 'none';
  document.getElementById('witchname-preview').style.display = tab === 'signup' ? 'block' : 'none';
  document.getElementById('input-username').value = '';
  document.getElementById('input-password').value = '';
  document.getElementById('input-password').autocomplete = tab === 'login' ? 'current-password' : 'new-password';
}

// ── Submit ──
async function handleSubmit(){
  const username = document.getElementById('input-username').value.trim();
  const password = document.getElementById('input-password').value;
  const errEl    = document.getElementById('error-msg');
  const btn      = document.getElementById('submit-btn');

  errEl.textContent = '';

  if(!username){ errEl.textContent = 'Enter a username.'; return; }
  if(!password){ errEl.textContent = 'Enter a password.'; return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="btn-spinner"></span>' + (currentTab === 'login' ? 'Signing in…' : 'Creating account…');

  try {
    const res = await fetch(`${WIX_API}/${currentTab}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();

    if(!res.ok){
      errEl.textContent = friendlyError(data.error);
      btn.disabled = false;
      btn.textContent = currentTab === 'login' ? 'Sign In' : 'Create Account';
      return;
    }

    // Success
    sessionStorage.setItem('hex_userId',   data.userId);
    sessionStorage.setItem('hex_witchName', data.witchName);
    sessionStorage.setItem('hex_username',  data.username);

    const successEl = document.getElementById('success-msg');
    successEl.textContent = currentTab === 'signup'
      ? `Welcome, ${data.witchName}! Redirecting…`
      : `Welcome back, ${data.witchName}! Redirecting…`;
    successEl.style.display = 'block';
    btn.textContent = '✓';

    setTimeout(() => { window.location.href = 'index.html'; }, 1200);

  } catch(e) {
    errEl.textContent = 'Connection error. Please try again.';
    btn.disabled = false;
    btn.textContent = currentTab === 'login' ? 'Sign In' : 'Create Account';
  }
}

function friendlyError(err){
  if(!err) return 'Something went wrong.';
  if(err.includes('already taken'))  return 'Username already taken. Choose another.';
  if(err.includes('not found'))      return 'Username not found.';
  if(err.includes('incorrect'))      return 'Incorrect password.';
  if(err.includes('at least 3'))     return 'Username must be at least 3 characters.';
  if(err.includes('at least 6'))     return 'Password must be at least 6 characters.';
  return err;
}

// ── Enter key ──
document.addEventListener('keydown', e => {
  if(e.key === 'Enter') handleSubmit();
});

// ── Auto-redirect if already logged in ──
if(sessionStorage.getItem('hex_userId')){
  window.location.href = 'index.html';
}
</script>
</body>
</html>
