<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Pack — Hex & Stitch</title>
<style>
  @font-face {
    font-family: 'Bloodcrow';
    src: url('https://cdn.jsdelivr.net/gh/furdecimbit/voodoo-generator@main/Bloodcrow.otf') format('opentype');
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #030201;
    color: #e8d09a;
    font-family: 'Bloodcrow', serif;
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* ── Smoke particles ── */
  #smoke-container {
    position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
  }
  .smoke-particle {
    position: absolute;
    border-radius: 50%;
    opacity: 0;
    animation: smokeRise linear infinite;
  }
  @keyframes smokeRise {
    0%   { transform: translateY(0) scale(0.5);  opacity: 0; }
    15%  { opacity: 0.18; }
    80%  { opacity: 0.10; }
    100% { transform: translateY(-80vh) scale(2.5); opacity: 0; }
  }

  /* ── Room glow ── */
  #room-glow {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(ellipse 60% 40% at 50% 60%, transparent, #030201 80%);
    transition: background 1s;
  }

  /* ── Back button ── */
  #back-btn {
    position: fixed; top: 18px; left: 18px; z-index: 100;
    background: rgba(20,12,4,0.8); border: 1px solid #3a2808;
    color: #7a6040; font-family: 'Bloodcrow', serif; font-size: 14px;
    letter-spacing: .08em; text-transform: uppercase;
    padding: 8px 16px; border-radius: 20px; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    transition: color .2s, border-color .2s;
  }
  #back-btn:hover { color: #e8c060; border-color: #6a4818; }
  #back-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ── Main stage ── */
  #stage {
    position: relative; z-index: 10;
    display: flex; flex-direction: column; align-items: center; gap: 24px;
    padding: 40px 20px 80px;
    width: 100%; max-width: 900px;
  }

  #rarity-title {
    font-size: 28px; letter-spacing: .2em; text-transform: uppercase;
    text-shadow: 0 0 30px currentColor;
    opacity: 0; transition: opacity .6s;
  }
  #rarity-title.visible { opacity: 1; }
  #rarity-title.rarity-common    { color: #e0e0e0; }
  #rarity-title.rarity-rare      { color: #e8c050; }
  #rarity-title.rarity-legendary { color: #80d0ff; }
  #rarity-title.rarity-ultimate  { color: #ff80c0; }

  /* ── Pack display ── */
  #pack-display {
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  #pack-img-wrap {
    cursor: pointer; position: relative;
    transition: transform .2s;
  }
  #pack-img-wrap:hover { transform: scale(1.04); }
  #pack-img {
    width: 220px; height: auto;
    filter: drop-shadow(0 0 30px var(--pack-glow, #ffffff44));
    animation: packFloat 3s ease-in-out infinite;
  }
  @keyframes packFloat {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-10px); }
  }
  #pack-img-wrap:hover #pack-img { animation: none; }

  #open-hint {
    font-size: 16px; letter-spacing: .12em; text-transform: uppercase;
    color: #6a5030; animation: hintPulse 2s ease-in-out infinite;
  }
  @keyframes hintPulse {
    0%, 100% { opacity: .5; }
    50%       { opacity: 1; }
  }

  /* ── Video overlay ── */
  #video-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: #000;
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
  }
  #video-overlay.active { display: flex; }
  #pack-video { width: 100%; max-width: 480px; height: auto; }
  #skip-btn {
    color: #5a4020; font-family: 'Bloodcrow', serif; font-size: 13px;
    letter-spacing: .1em; text-transform: uppercase;
    background: none; border: none; cursor: pointer;
    transition: color .2s;
  }
  #skip-btn:hover { color: #c8a050; }

  /* ── Cards grid ── */
  #cards-area {
    display: none; flex-direction: column; align-items: center; gap: 24px; width: 100%;
  }
  #cards-area.visible { display: flex; }

  #cards-row {
    display: flex; flex-wrap: wrap; gap: 16px;
    justify-content: center; width: 100%;
  }

  /* Card flip */
  .reveal-card {
    width: 140px; perspective: 900px;
    opacity: 0; transform: translateY(30px);
    transition: opacity .4s, transform .4s;
  }
  .reveal-card.appeared { opacity: 1; transform: translateY(0); }
  .reveal-card-inner {
    position: relative; width: 100%; padding-top: 140%;
    transform-style: preserve-3d;
    transition: transform .7s cubic-bezier(.4,0,.2,1);
    cursor: pointer;
  }
  .reveal-card.flipped .reveal-card-inner { transform: rotateY(180deg); cursor: default; }
  .card-face {
    position: absolute; inset: 0;
    border-radius: 12px; overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  /* Back face — mystical card back */
  .card-back {
    background: linear-gradient(135deg, #1a0e06, #0e0804);
    border: 1px solid #3a2010;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 20px rgba(0,0,0,.8);
  }
  .card-back svg { width: 60px; height: 60px; opacity: .4; }
  /* Front face — item */
  .card-front {
    transform: rotateY(180deg);
    display: flex; flex-direction: column; align-items: center;
    padding: 10px 8px 10px;
    background: linear-gradient(160deg, #1a1008, #0e0804);
    border: 1px solid #4a2810;
  }
  .card-front.rarity-common    { border-color: #4a4a4a; box-shadow: 0 0 16px #ffffff22; }
  .card-front.rarity-rare      { border-color: #8a6820; box-shadow: 0 0 20px #e8c05044; }
  .card-front.rarity-legendary { border-color: #3060a0; box-shadow: 0 0 24px #60b0f066; }
  .card-front.rarity-ultimate  { border-color: #902060; box-shadow: 0 0 28px #ff80c077; }
  .card-item-img {
    width: 80px; height: 80px; object-fit: contain;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,.6));
  }
  .card-item-name {
    font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    color: #c8a878; margin-top: 6px; text-align: center; line-height: 1.3;
  }
  .card-item-cat {
    font-size: 10px; color: #5a4020; letter-spacing: .08em; text-transform: uppercase;
    margin-top: 2px;
  }
  .card-stats {
    display: flex; gap: 6px; margin-top: 8px;
  }
  .card-stat {
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    font-size: 9px; letter-spacing: .05em; text-transform: uppercase;
  }
  .card-stat .sv { font-size: 13px; }
  .card-stat.curse .sv { color: #e05050; }
  .card-stat.doom  .sv { color: #9060e0; }
  .card-stat.hex   .sv { color: #50b0e0; }
  .card-stat .sl { color: #5a4020; }

  /* ── Tap hint under cards ── */
  #tap-hint {
    font-size: 14px; letter-spacing: .1em; text-transform: uppercase;
    color: #5a4020; animation: hintPulse 2s ease-in-out infinite;
  }

  /* ── Collect button ── */
  #collect-btn {
    display: none;
    background: linear-gradient(135deg, #6030c0, #3a1878);
    border: 1px solid #8040e0;
    color: #e8d0ff; font-family: 'Bloodcrow', serif;
    font-size: 20px; letter-spacing: .12em; text-transform: uppercase;
    padding: 14px 48px; border-radius: 30px; cursor: pointer;
    box-shadow: 0 0 30px #6030c066;
    animation: collectGlow 2s ease-in-out infinite;
    transition: transform .15s;
  }
  #collect-btn.visible { display: block; }
  #collect-btn:hover { transform: scale(1.04); }
  @keyframes collectGlow {
    0%, 100% { box-shadow: 0 0 24px #6030c066; }
    50%       { box-shadow: 0 0 48px #8050e088; }
  }

  /* Mobile tweaks */
  @media (max-width: 600px) {
    .reveal-card { width: 110px; }
    .card-item-img { width: 60px; height: 60px; }
    #pack-img { width: 170px; }
    #rarity-title { font-size: 22px; }
  }
</style>
</head>
<body>

<div id="smoke-container"></div>
<div id="room-glow"></div>

<button id="back-btn" onclick="goBack()">
  <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  Forge
</button>

<div id="stage">
  <div id="rarity-title"></div>

  <!-- Pack display -->
  <div id="pack-display">
    <div id="pack-img-wrap" onclick="startOpen()">
      <img id="pack-img" src="" alt="Pack">
    </div>
    <div id="open-hint">Click to open</div>
  </div>

  <!-- Cards after opening -->
  <div id="cards-area">
    <div id="tap-hint">Tap each card to reveal</div>
    <div id="cards-row"></div>
    <button id="collect-btn" onclick="collectAndReturn()">Add to Collection</button>
  </div>
</div>

<!-- Video overlay -->
<div id="video-overlay">
  <video id="pack-video" playsinline></video>
  <button id="skip-btn" onclick="skipVideo()">Skip</button>
</div>

<script>
const CDN = 'https://cdn.jsdelivr.net/gh/furdecimbit/voodoo-generator@main';
const WIX_API = 'https://www.alperozdil.com/_functions';

const PACK_IMGS = {
  common:    'common_pack.png',
  rare:      'rare_pack.png',
  legendary: 'legendary_pack.png',
  ultimate:  'ultimate_pack.png'
};

const GLOW_COLORS = {
  common:    '#ffffff44',
  rare:      '#e8c05066',
  legendary: '#60b0ff88',
  ultimate:  '#ff80c099'
};

const RARITY_TOTALS = { common:15, rare:40, legendary:90, ultimate:180 };

function hashStr(s){
  let h = 5381;
  for(let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}

function itemStats(path){
  const filename = path.split('/').pop();
  const rarity   = path.split('/')[1] || 'common';
  const h = hashStr(filename);
  const total = RARITY_TOTALS[rarity] || 15;
  const a = 1 + (h % 7);
  const b = 1 + ((h >>> 4) % 7);
  const sum = a + b + (1 + ((h >>> 8) % 7));
  const curse = Math.round(total * a / sum);
  const doom  = Math.round(total * b / sum);
  const hex   = Math.max(1, total - curse - doom);
  return { curse, doom, hex };
}

// ── URL params ──
const params   = new URLSearchParams(location.search);
const wallet   = params.get('wallet')   || '';
const rarity   = params.get('rarity')  || 'common';
const mint     = params.get('mint')    || '';
const platform = params.get('platform')|| 'sol';

let rolledItems = [];
let allFlipped  = false;

// ── Init ──
(function init(){
  // Title
  const title = document.getElementById('rarity-title');
  title.textContent = rarity.toUpperCase() + ' PACK';
  title.className = `rarity-${rarity}`;
  setTimeout(()=> title.classList.add('visible'), 100);

  // Pack image
  document.getElementById('pack-img').src = PACK_IMGS[rarity];
  document.documentElement.style.setProperty('--pack-glow', GLOW_COLORS[rarity]);

  // Room glow tint
  const tints = {
    common:    'rgba(255,255,255,0.03)',
    rare:      'rgba(232,192,80,0.04)',
    legendary: 'rgba(96,176,255,0.05)',
    ultimate:  'rgba(255,128,192,0.06)'
  };
  document.getElementById('room-glow').style.background =
    `radial-gradient(ellipse 70% 50% at 50% 50%, ${tints[rarity]}, #030201 70%)`;

  buildSmoke();
})();

// ── Smoke ──
function buildSmoke(){
  const container = document.getElementById('smoke-container');
  const colors = {
    common:    ['#ffffff', '#cccccc'],
    rare:      ['#c09040', '#e8c060'],
    legendary: ['#4080c0', '#80c0ff'],
    ultimate:  ['#c040a0', '#ff80c0']
  }[rarity] || ['#ffffff'];

  for(let i = 0; i < 18; i++){
    const p = document.createElement('div');
    p.className = 'smoke-particle';
    const size = 80 + Math.random() * 200;
    p.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      bottom:${-size}px;
      background: radial-gradient(circle, ${colors[i%colors.length]}18 0%, transparent 70%);
      animation-duration: ${6 + Math.random()*8}s;
      animation-delay: ${Math.random()*8}s;
    `;
    container.appendChild(p);
  }
}

// ── Open ──
function startOpen(){
  document.getElementById('pack-display').style.display = 'none';

  const overlay = document.getElementById('video-overlay');
  const vid     = document.getElementById('pack-video');
  vid.src = 'openpack.mp4';
  vid.currentTime = 0;
  overlay.classList.add('active');
  vid.play().catch(()=> skipVideo());
  vid.onended = skipVideo;
}

function skipVideo(){
  const overlay = document.getElementById('video-overlay');
  const vid     = document.getElementById('pack-video');
  overlay.classList.remove('active');
  vid.pause(); vid.src = '';
  revealCards();
}

// ── Roll & reveal ──
async function revealCards(){
  // Call openPack server-side
  try {
    const res = await fetch(`${WIX_API}/openPack`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ wallet, rarity, mintAddress: mint })
    });
    const data = await res.json();
    rolledItems = data.items || [];
  } catch(e){
    console.warn('openPack failed, rolling locally');
    rolledItems = localRoll(rarity);
  }

  if(rolledItems.length === 0){
    // Collection complete — nothing new
    showCollectionComplete();
    return;
  }

  const area = document.getElementById('cards-area');
  const row  = document.getElementById('cards-row');
  area.classList.add('visible');

  rolledItems.forEach((item, i) => {
    const card = buildCard(item);
    row.appendChild(card);
    setTimeout(()=> card.classList.add('appeared'), 200 + i * 180);
  });
}

function buildCard(item){
  const name  = item.path.split('/').pop().replace(/\.(png|PNG|jpg|JPG)$/,'').replace(/_/g,' ');
  const cat   = (item.cat || '').split('_')[0];
  const stats = itemStats(item.path);
  const imgSrc = CDN + '/' + item.path;

  const card = document.createElement('div');
  card.className = 'reveal-card';
  card.innerHTML = `
    <div class="reveal-card-inner" onclick="flipCard(this)">
      <div class="card-face card-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="#c8a060" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
      </div>
      <div class="card-face card-front rarity-${item.rarity}">
        <img class="card-item-img" src="${imgSrc}" alt="${name}" onerror="this.style.opacity='.3'">
        <div class="card-item-name">${name}</div>
        <div class="card-item-cat">${cat}</div>
        <div class="card-stats">
          <div class="card-stat curse"><span class="sv">${stats.curse}</span><span class="sl">Curse</span></div>
          <div class="card-stat doom"><span class="sv">${stats.doom}</span><span class="sl">Doom</span></div>
          <div class="card-stat hex"><span class="sv">${stats.hex}</span><span class="sl">Hex</span></div>
        </div>
      </div>
    </div>`;
  return card;
}

function flipCard(inner){
  const card = inner.parentElement;
  if(card.classList.contains('flipped')) return;
  card.classList.add('flipped');
  checkAllFlipped();
}

function checkAllFlipped(){
  const cards   = document.querySelectorAll('.reveal-card');
  const flipped = document.querySelectorAll('.reveal-card.flipped');
  if(cards.length > 0 && cards.length === flipped.length){
    document.getElementById('tap-hint').style.display = 'none';
    const btn = document.getElementById('collect-btn');
    btn.classList.add('visible');
    allFlipped = true;
  }
}

function showCollectionComplete(){
  const area = document.getElementById('cards-area');
  area.classList.add('visible');
  document.getElementById('tap-hint').style.display = 'none';
  document.getElementById('cards-row').innerHTML =
    `<div style="font-size:18px;color:#7a6040;letter-spacing:.1em;text-align:center;padding:40px 20px;">
      Your ${rarity} collection is complete.<br>
      <span style="font-size:13px;color:#4a3010">No new items remain in this rarity.</span>
    </div>`;
  document.getElementById('collect-btn').classList.add('visible');
  document.getElementById('collect-btn').textContent = 'Return to Forge';
  allFlipped = true;
}

// ── Collect & return ──
function collectAndReturn(){
  // Mark mint as opened in localStorage
  if(mint && wallet){
    const key = `${wallet}_openedMints`;
    const opened = JSON.parse(localStorage.getItem(key) || '[]');
    if(!opened.includes(mint)) opened.push(mint);
    localStorage.setItem(key, JSON.stringify(opened));
  }
  // Deduct pack
  if(wallet){
    const key = `${wallet}_packInventory`;
    const inv  = JSON.parse(localStorage.getItem(key) || '{}');
    inv[rarity] = Math.max(0, (inv[rarity] || 1) - 1);
    localStorage.setItem(key, JSON.stringify(inv));
  }
  goBack();
}

function goBack(){
  location.href = 'index.html';
}

// ── Local fallback roll ──

function localRoll(rarity){
  const cats = ['body','knife','offhand','necklace','eyes'];
  const pool = PACK_ITEMS[rarity];
  if(!pool) return [];
  const count = Math.random() < 0.5 ? 2 : 3;
  const shuffled = [...cats].sort(()=>Math.random()-.5);
  const chosen = [];
  for(let i = 0; i < shuffled.length && chosen.length < count; i++){
    const cat = shuffled[i];
    const items = pool[cat];
    if(!items || !items.length) continue;
    chosen.push({ path: items[Math.floor(Math.random()*items.length)], cat, rarity });
  }
  return chosen;
}
