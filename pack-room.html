<!DOCTYPE html>
<html lang="en" data-page="packs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pack Room — Hex & Stitch</title>
<style>
  @font-face {
    font-family: 'Bloodcrow';
    src: url('https://cdn.jsdelivr.net/gh/furdecimbit/voodoo-generator@main/bloodcrowc.ttf') format('truetype');
  }
  @font-face {
    font-family: 'BloodcrowOtf';
    src: url('https://cdn.jsdelivr.net/gh/furdecimbit/voodoo-generator@main/Bloodcrow.otf') format('opentype');
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #080608;
    color: #e8d09a;
    font-family: 'Bloodcrow', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Smoke ── */
  #smoke-container { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .smoke-particle {
    position:absolute; border-radius:50%; opacity:0;
    animation: smokeRise linear infinite;
  }
  @keyframes smokeRise {
    0%   { transform:translateY(0) scale(0.5); opacity:0; }
    15%  { opacity:0.18; }
    80%  { opacity:0.10; }
    100% { transform:translateY(-80vh) scale(2.5); opacity:0; }
  }

  /* ── Room glow ── */
  #room-glow {
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background: radial-gradient(ellipse 60% 40% at 50% 60%, transparent, #080608 80%);
    transition: background 1.2s;
  }

  /* ── 3-column layout ── */
  #room {
    display: grid;
    grid-template-columns: 380px 1fr 380px;
    min-height: calc(100vh - 82px);
    position: relative; z-index: 10;
  }

  /* ── Panel shared ── */
  .panel {
    display: flex; flex-direction: column;
    padding: 28px 20px; gap: 24px;
    overflow-y: auto;
  }
  #panel-left {
    border-right: 1px solid #2a1a06;
    background-image: linear-gradient(180deg,#2a1a08cc 0%,#1a1006cc 100%), url('verticalback.png');
    background-size: cover; background-position: center;
  }
  #panel-right {
    border-left: 1px solid #2a1a06;
    background-image: linear-gradient(180deg,#1a1208cc 0%,#141008cc 100%), url('verticalback.png');
    background-size: cover; background-position: center;
  }

  #page-title {
    font-size: 38px; letter-spacing: .14em; text-transform: uppercase;
    color: #e8c87a; margin-bottom: 22px; line-height:1.1;
    text-shadow: 0 0 18px #e8a02066, 0 2px 4px #000;
  }
  .panel-title {
    font-size: 26px; letter-spacing: .18em; text-transform: uppercase;
    color: #7a5520; margin-bottom: 6px;
  }

  /* ── Logo ── */
  #logo-link { display:flex; align-items:center; gap:8px; text-decoration:none; margin-bottom:4px; }
  #logo-link img { height:28px; opacity:.8; }
  #logo-link span { font-size:13px; letter-spacing:.08em; color:#5a4020; text-transform:uppercase; }

  /* ── Wallet section ── */
  #wallet-status-row { display:flex; flex-direction:column; gap:8px; }
  .wallet-platform-status {
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-radius:8px;
    border:1px solid #2a1a06; background:rgba(255,255,255,0.02);
  }
  .wallet-platform-status img {
    width:32px; height:32px; border-radius:50%; object-fit:cover;
    border:2px solid #cc2020; flex-shrink:0;
    box-shadow:0 0 8px #cc202044;
  }
  .wallet-platform-status.connected img {
    border-color:#20cc50; box-shadow:0 0 10px #20cc5066;
  }
  .wallet-platform-status span {
    font-size:30px; color:#5a4020; letter-spacing:.06em; text-transform:uppercase;
  }
  .wallet-platform-status.connected span { color:#70c880; }
  #wallet-syncing {
    font-size:28px; color:#70c060; letter-spacing:.1em; display:none;
    animation: hintPulse 1.4s ease-in-out infinite;
  }

  /* ── Pack list ── */
  #pack-list { display:flex; flex-direction:column; gap:6px; }
  #packs-empty-msg {
    font-size:14px; color:#5a4020; text-align:center;
    padding:24px 0; letter-spacing:.08em; text-transform:uppercase;
  }
  .packs-loading-msg {
    display:flex; align-items:center; justify-content:center; gap:10px;
    font-size:15px; color:#a08050; text-align:center;
    padding:24px 0; letter-spacing:.12em; text-transform:uppercase;
  }
  .pack-spinner {
    width:18px; height:18px; border-radius:50%; flex-shrink:0;
    border:2px solid #3a2808;
    border-top-color:#e8c050;
    animation:spinnerTurn .7s linear infinite;
  }
  @keyframes spinnerTurn { to { transform:rotate(360deg); } }
  .pack-entry {
    display:flex; align-items:center; gap:14px;
    padding:14px 14px; border-radius:12px; cursor:pointer;
    border:1px solid #4a2880;
    background:linear-gradient(135deg,#2a1060ee,#1a0840ee);
    transition:border-color .2s, background .2s, box-shadow .2s;
  }
  .pack-entry img    { width:80px; height:80px; object-fit:contain; flex-shrink:0; }
  .pack-entry-info   { flex:1; min-width:0; }
  .pack-entry-name {
    font-size:18px; letter-spacing:.08em; text-transform:uppercase;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .pack-entry-badge {
    min-width:34px; height:34px; border-radius:50%; flex-shrink:0;
    background:#c02020; color:#fff;
    font-size:20px; font-family:'BloodcrowOtf', serif; letter-spacing:0;
    display:flex; align-items:center; justify-content:center;
    padding:0 6px; box-shadow:0 0 8px #c0202066;
  }

  /* rarity-based backgrounds */
  .pack-entry[data-rarity="common"]    { background:linear-gradient(135deg,#2a2a2aee,#141414ee); border-color:#555; }
  .pack-entry[data-rarity="rare"]      { background:linear-gradient(135deg,#3a2800ee,#1e1200ee); border-color:#7a5210; }
  .pack-entry[data-rarity="legendary"] { background:linear-gradient(135deg,#0a1e3aee,#050e20ee); border-color:#2a5080; }
  .pack-entry[data-rarity="ultimate"]  { background:linear-gradient(135deg,#2a0a1eee,#140510ee); border-color:#701040; }

  .pack-entry[data-rarity="common"]:hover    { border-color:#aaa;    box-shadow:0 0 14px #ffffff22; background:linear-gradient(135deg,#3a3a3aee,#202020ee); }
  .pack-entry[data-rarity="rare"]:hover      { border-color:#c89030; box-shadow:0 0 16px #e8c05033; background:linear-gradient(135deg,#4a3400ee,#261800ee); }
  .pack-entry[data-rarity="legendary"]:hover { border-color:#4080c0; box-shadow:0 0 18px #60b0ff44; background:linear-gradient(135deg,#0e2a50ee,#07142aee); }
  .pack-entry[data-rarity="ultimate"]:hover  { border-color:#c03080; box-shadow:0 0 20px #ff80c055; background:linear-gradient(135deg,#3a0e28ee,#1c0614ee); }

  .pack-entry[data-rarity="common"].active    { border-color:#ccc;    box-shadow:0 0 20px #ffffff33; }
  .pack-entry[data-rarity="rare"].active      { border-color:#e8c050; box-shadow:0 0 22px #e8c05066; }
  .pack-entry[data-rarity="legendary"].active { border-color:#60b0ff; box-shadow:0 0 26px #60b0ff77; }
  .pack-entry[data-rarity="ultimate"].active  { border-color:#ff80c0; box-shadow:0 0 30px #ff80c088; }

  .pack-entry-name.rarity-common    { color:#c0c0c0; }
  .pack-entry-name.rarity-rare      { color:#e8c050; }
  .pack-entry-name.rarity-legendary { color:#80d0ff; }
  .pack-entry-name.rarity-ultimate  { color:#ff80c0; }

  /* ── Center panel ── */
  #panel-center {
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:40px 24px; gap:24px;
    min-height:100vh;
    background-image: linear-gradient(rgba(3,2,1,0.88), rgba(3,2,1,0.88)), url('packs.png');
    background-size: cover; background-position: center;
  }

  #center-idle {
    font-size:20px; color:#5a4020;
    letter-spacing:.15em; text-transform:uppercase;
    text-align:center;
  }

  /* Pack float */
  #center-pack {
    display:none; flex-direction:column; align-items:center; gap:16px;
  }
  #rarity-title {
    font-size:42px; letter-spacing:.2em; text-transform:uppercase;
    text-shadow:0 0 32px currentColor;
    opacity:0; transition:opacity .6s;
  }
  #rarity-title.visible { opacity:1; }
  #rarity-title.rarity-common    { color:#e0e0e0; }
  #rarity-title.rarity-rare      { color:#e8c050; }
  #rarity-title.rarity-legendary { color:#80d0ff; }
  #rarity-title.rarity-ultimate  { color:#ff80c0; }

  #pack-img-wrap { cursor:pointer; transition:transform .2s; }
  #pack-img-wrap:hover { transform:scale(1.04); }
  #pack-img {
    width:360px; height:auto;
    filter:drop-shadow(0 0 50px var(--pack-glow,#ffffff44));
    animation:packFloat 3s ease-in-out infinite;
  }
  @keyframes packFloat {
    0%,100% { transform:translateY(0); }
    50%      { transform:translateY(-10px); }
  }
  #pack-img-wrap:hover #pack-img { animation:none; }
  #open-hint {
    font-size:20px; letter-spacing:.12em; text-transform:uppercase;
    color:#8a6840; animation:hintPulse 2s ease-in-out infinite;
  }
  @keyframes hintPulse { 0%,100%{opacity:.5;} 50%{opacity:1;} }

  /* Video overlay */
  #video-overlay {
    position:fixed; inset:0; z-index:200;
    background:#000;
    display:none; align-items:center; justify-content:center;
    flex-direction:column; gap:16px;
  }
  #video-overlay.active { display:flex; }
  #pack-video  { width:100%; max-width:480px; height:auto; }
  #skip-btn {
    color:#5a4020; font-family:'Bloodcrow',serif; font-size:13px;
    letter-spacing:.1em; text-transform:uppercase;
    background:none; border:none; cursor:pointer; transition:color .2s;
  }
  #skip-btn:hover { color:#c8a050; }

  /* Reveal area */
  #center-reveal {
    display:none; flex-direction:column; align-items:center; gap:20px; width:100%;
  }
  #tap-hint {
    font-size:16px; letter-spacing:.1em; text-transform:uppercase;
    color:#5a4020; animation:hintPulse 2s ease-in-out infinite;
  }
  #cards-row {
    display:flex; flex-wrap:wrap; gap:14px; justify-content:center; width:100%;
  }

  /* Card flip */
  .reveal-card {
    width:240px; perspective:900px;
    opacity:0; transform:translateY(30px);
    transition:opacity .4s, transform .4s;
  }
  .reveal-card.appeared { opacity:1; transform:translateY(0); }
  .reveal-card-inner {
    position:relative; width:100%; padding-top:140%;
    transform-style:preserve-3d;
    transition:transform .7s cubic-bezier(.4,0,.2,1);
    cursor:pointer;
  }
  .reveal-card.flipped .reveal-card-inner { transform:rotateY(180deg); cursor:default; }
  .card-face {
    position:absolute; inset:0;
    border-radius:12px; overflow:hidden;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
  }
  .card-back {
    border:1px solid #3a2010;
    display:flex; align-items:center; justify-content:center;
    background-image: url('verticalback.png');
    background-size: 130%; background-position: center;
  }
  .card-back svg { width:56px; height:56px; opacity:.5; }

  /* rarity glow on card back */
  .reveal-card.rarity-common  .card-back { box-shadow:0 0 18px #ffffff55; border-color:#6a6a6a; }
  .reveal-card.rarity-rare    .card-back { box-shadow:0 0 22px #e8c05077; border-color:#8a6820; }
  .reveal-card.rarity-legendary .card-back { box-shadow:0 0 26px #60b0ff88; border-color:#3060a0; }
  .reveal-card.rarity-ultimate  .card-back { box-shadow:0 0 30px #ff80c099; border-color:#902060; }

  .card-front {
    transform:rotateY(180deg);
    display:flex; flex-direction:column; align-items:center;
    padding:10px 8px;
    background-image: url('verticalback.png');
    background-size: 130%; background-position: center;
    border:1px solid #4a2810;
  }
  .card-front::before {
    content:''; position:absolute; inset:0;
    background: rgba(8,4,1,0.82);
    border-radius:12px;
    pointer-events:none;
  }

  /* rarity glow on card front (after reveal) */
  .card-front.rarity-common    { border-color:#6a6a6a; box-shadow:0 0 18px #ffffff44; }
  .card-front.rarity-rare      { border-color:#8a6820; box-shadow:0 0 22px #e8c05066; }
  .card-front.rarity-legendary { border-color:#3060a0; box-shadow:0 0 26px #60b0ff77; }
  .card-front.rarity-ultimate  { border-color:#902060; box-shadow:0 0 30px #ff80c088; }
  .card-front > * { position:relative; z-index:1; }
  .card-item-img {
    width:150px; height:150px; object-fit:contain;
    filter:drop-shadow(0 2px 14px rgba(0,0,0,.7));
  }
  .card-item-name {
    font-size:16px; letter-spacing:.06em; text-transform:uppercase;
    color:#c8a878; margin-top:12px; text-align:center; line-height:1.3;
  }
  .card-item-cat { font-size:13px; color:#6a5030; letter-spacing:.08em; text-transform:uppercase; margin-top:5px; }
  .card-stats    { display:flex; gap:20px; margin-top:20px; }
  .card-stat     { display:flex; flex-direction:column; align-items:center; gap:3px; font-size:15px; letter-spacing:.05em; text-transform:uppercase; }
  .card-stat .sv { font-size:28px; }
  .card-stat.curse .sv { color:#e05050; }
  .card-stat.doom  .sv { color:#9060e0; }
  .card-stat.hex   .sv { color:#50b0e0; }
  .card-stat .sl { color:#5a4020; }

  /* Collect btn */
  #collect-btn {
    display:none;
    background:linear-gradient(135deg,#6030c0,#3a1878);
    border:1px solid #8040e0; color:#e8d0ff;
    font-family:'Bloodcrow',serif; font-size:22px;
    letter-spacing:.12em; text-transform:uppercase;
    padding:12px 44px; border-radius:28px; cursor:pointer;
    box-shadow:0 0 28px #6030c055;
    animation:collectGlow 2s ease-in-out infinite;
    transition:transform .15s;
  }
  #collect-btn:hover { transform:scale(1.04); }
  @keyframes collectGlow {
    0%,100%{ box-shadow:0 0 22px #6030c055; }
    50%    { box-shadow:0 0 44px #8050e077; }
  }

  /* ── Right panel ── */
  .stat-row {
    display:flex; justify-content:space-between; align-items:center;
    padding:7px 0; border-bottom:1px solid #160e04;
  }
  .stat-label { font-size:28px; letter-spacing:.12em; text-transform:uppercase; color:#7a5520; }
  .stat-val   { font-size:30px; }
  .stat-row.total .stat-val         { color:#e8d09a; }
  .stat-row.rarity-common .stat-val    { color:#c0c0c0; }
  .stat-row.rarity-rare .stat-val      { color:#e8c050; }
  .stat-row.rarity-legendary .stat-val { color:#80d0ff; }
  .stat-row.rarity-ultimate .stat-val  { color:#ff80c0; }

  #home-link {
    margin-top:auto; display:block; text-align:center;
    text-decoration:none; padding:10px 14px; border-radius:8px;
    border:1px solid #2a1a06; color:#5a4020;
    font-size:12px; letter-spacing:.1em; text-transform:uppercase;
    transition:border-color .2s, color .2s;
  }
  #home-link:hover { border-color:#6a4010; color:#c8a040; }

  /* ── Mobile ── */
  @media (max-width: 800px) {

    #room {
      grid-template-columns: 1fr;
      grid-template-rows: auto;
    }

    /* Panels stack, center hidden by default (shown as overlay when pack selected) */
    #panel-left  { order:1; border-right:none; border-bottom:1px solid #2e2010; background: linear-gradient(180deg,#2a1e0eee 0%,#1e1408ee 100%), url('verticalback.png'); background-size:cover; }
    #panel-right { order:2; border-left:none; border-top:1px solid #2e2010; background: linear-gradient(180deg,#221a0eee 0%,#1a1208ee 100%), url('verticalback.png'); background-size:cover; }
    #panel-center { display:none; }

    /* Center as fullscreen overlay when pack selected */
    #panel-center.mob-open {
      display: flex !important;
      position: fixed; inset: 0; z-index: 300;
      overflow-y: auto;
      background: #070402f0;
      padding-top: 8px;
    }

    /* Back button (injected by JS) */
    #mob-back-btn {
      position: sticky; top: 8px; align-self: flex-start;
      z-index: 10; margin: 0 0 8px 12px;
      background: #0e0804; border: 1px solid #3a2010;
      border-radius: 8px; padding: 8px 18px;
      font-family: 'Bloodcrow', serif; font-size: 14px;
      letter-spacing: .1em; text-transform: uppercase;
      color: #7a5520; cursor: pointer;
      transition: color .2s, border-color .2s;
    }
    #mob-back-btn:hover { color: #e8c060; border-color: #8a5020; }

    /* Pack entry: bigger tap target */
    .pack-entry { padding: 12px; }
    .pack-entry img { width: 60px; height: 60px; }
    .pack-entry-name { font-size: 15px; }
    .pack-entry-badge { min-width: 28px; height: 28px; font-size: 16px; }

    /* Text */
    .wallet-platform-status span { font-size: 16px; }
    .panel-title  { font-size: 18px; }
    #page-title   { font-size: 26px; margin-bottom: 10px; }
    .stat-label   { font-size: 18px; }
    .stat-val     { font-size: 22px; }

    /* Video overlay full width */
    #pack-video { max-width: 100%; }
  }
</style>
</head>
<body>

<div id="site-header-mount"></div>

<div id="smoke-container"></div>
<div id="room-glow"></div>

<div id="room">

  <!-- ════════════════ LEFT PANEL ════════════════ -->
  <div class="panel" id="panel-left">

    <div id="page-title">Hex Packs</div>

    <!-- Wallet status -->
    <div>
      <div class="panel-title">Wallet</div>
      <div id="wallet-status-row">
        <div class="wallet-platform-status" id="wps-sol">
          <img src="drip.jpeg" alt="Solana">
          <span id="wps-sol-addr">Not connected</span>
        </div>
        <div class="wallet-platform-status" id="wps-tez" style="display:none">
          <img src="objkt.jpeg" alt="Tezos">
          <span id="wps-tez-addr">Not connected</span>
        </div>
      </div>
      <div id="wallet-syncing">Loading packs…</div>
    </div>

    <!-- Packs -->
    <div>
      <div class="panel-title">Your Packs</div>
      <div id="pack-list">
        <div id="packs-empty-msg">Connect wallet to load packs</div>
      </div>
    </div>

  </div>

  <!-- ════════════════ CENTER PANEL ════════════════ -->
  <div id="panel-center">

    <div id="center-idle">Select a pack to open</div>

    <div id="center-pack">
      <div id="rarity-title"></div>
      <div id="pack-img-wrap" onclick="startOpen()">
        <img id="pack-img" src="" alt="Pack">
      </div>
      <div id="open-hint">Click to open</div>
    </div>

    <div id="center-reveal">
      <div id="tap-hint">Tap each card to reveal</div>
      <div id="cards-row"></div>
      <button id="collect-btn" onclick="collectPack()">Claim Items</button>
    </div>

  </div>

  <!-- ════════════════ RIGHT PANEL ════════════════ -->
  <div class="panel" id="panel-right">

    <div class="panel-title">Session</div>

    <div id="session-stats">
      <div class="stat-row total">
        <span class="stat-label">Opened</span>
        <span class="stat-val" id="stat-total">0</span>
      </div>
      <div class="stat-row rarity-ultimate" id="stat-row-ultimate" style="display:none">
        <span class="stat-label">Ultimate</span>
        <span class="stat-val" id="stat-ultimate">0</span>
      </div>
      <div class="stat-row rarity-legendary" id="stat-row-legendary" style="display:none">
        <span class="stat-label">Legendary</span>
        <span class="stat-val" id="stat-legendary">0</span>
      </div>
      <div class="stat-row rarity-rare" id="stat-row-rare" style="display:none">
        <span class="stat-label">Rare</span>
        <span class="stat-val" id="stat-rare">0</span>
      </div>
      <div class="stat-row rarity-common" id="stat-row-common" style="display:none">
        <span class="stat-label">Common</span>
        <span class="stat-val" id="stat-common">0</span>
      </div>
    </div>

    <a id="home-link" href="index.html">← Home</a>

  </div>

</div>

<!-- Video overlay -->
<div id="video-overlay">
  <video id="pack-video" playsinline></video>
  <button id="skip-btn" onclick="skipVideo()">Skip</button>
</div>

<script src="https://unpkg.com/@airgap/beacon-dapp@4.8.1/dist/walletbeacon.dapp.min.js"></script>
<script src="site-header.js"></script>
<script>

// ── Constants ──────────────────────────────────────────────────
const CDN  = 'https://cdn.jsdelivr.net/gh/furdecimbit/voodoo-generator@main';
// WIX_API defined in site-header.js
const PACK_COLLECTION = 'EvoqHMeGs3VxtoLLycVaQ3CjuVTkJsUa6mcUCUcTDcm4';
const HELIUS_URL = 'https://mainnet.helius-rpc.com/?api-key=d9dba9ac-f923-4ed6-9a90-f389a71e9bcc';

const PACK_IMGS = {
  common:'common_pack.png', rare:'rare_pack.png',
  legendary:'legendary_pack.png', ultimate:'ultimate_pack.png'
};
const GLOW_COLORS = {
  common:'#ffffff44', rare:'#e8c05066', legendary:'#60b0ff88', ultimate:'#ff80c099'
};
const RARITIES = ['ultimate','legendary','rare','common'];
const RARITY_TOTALS = { common:15, rare:40, legendary:90, ultimate:180 };

// ── State ──────────────────────────────────────────────────────
let currentWallet   = null;
let currentPlatform = null;
let activePack      = null;
let packCounts      = { common:0, rare:0, legendary:0, ultimate:0 };
let rolledItems     = [];
const sessionCounts = { common:0, rare:0, legendary:0, ultimate:0 };

// ── Init ───────────────────────────────────────────────────────
buildSmoke('neutral');

// ── Smoke ──────────────────────────────────────────────────────
function buildSmoke(rarity){
  const container = document.getElementById('smoke-container');
  container.innerHTML = '';
  const colors = {
    neutral:   ['#c8a040','#6a4010'],
    common:    ['#ffffff','#cccccc'],
    rare:      ['#c09040','#e8c060'],
    legendary: ['#4080c0','#80c0ff'],
    ultimate:  ['#c040a0','#ff80c0']
  }[rarity] || ['#c8a040'];

  for(let i = 0; i < 18; i++){
    const p = document.createElement('div');
    p.className = 'smoke-particle';
    const size = 80 + Math.random()*200;
    p.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      bottom:${-size}px;
      background:radial-gradient(circle, ${colors[i%colors.length]}18 0%, transparent 70%);
      animation-duration:${6+Math.random()*8}s;
      animation-delay:${Math.random()*8}s;
    `;
    container.appendChild(p);
  }
}

function setRoomGlow(rarity){
  const tints = {
    common:'rgba(255,255,255,0.03)', rare:'rgba(232,192,80,0.04)',
    legendary:'rgba(96,176,255,0.05)', ultimate:'rgba(255,128,192,0.06)'
  };
  document.getElementById('room-glow').style.background =
    `radial-gradient(ellipse 70% 50% at 50% 50%, ${tints[rarity]||tints.common}, #030201 70%)`;
}

// ── Wallet — Solana ────────────────────────────────────────────
function detectSolanaWallets(){
  const wallets = []; const seen = new Set();
  const add = (name, p) => {
    if(p && typeof p.connect==='function' && !seen.has(p)){ seen.add(p); wallets.push({name, provider:p}); }
  };
  add('Phantom',  window.phantom?.solana);
  add('Phantom',  window.solana?.isPhantom ? window.solana : null);
  add('Solflare', window.solflare);
  add('Backpack', window.backpack?.solana ?? window.backpack);
  add('Brave',    window.solana?.isBraveWallet ? window.solana : null);
  add('Glow',     window.glowSolana);
  add('Jupiter',  window.jupiter?.solana ?? window.jupiter);
  add('Coinbase', window.coinbaseSolana);
  add('Exodus',   window.exodus?.solana);
  add('Wallet',   window.solana);
  return wallets;
}

function showWalletPicker(wallets){
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.style.cssText='position:fixed;inset:0;background:#00000099;z-index:9999;display:flex;align-items:center;justify-content:center;';
    const box = document.createElement('div');
    box.style.cssText="background:#1a1208;border:1px solid #7a5520;border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:12px;min-width:220px;";
    const title = document.createElement('div');
    title.textContent='Select Wallet';
    title.style.cssText="font-family:'Bloodcrow',serif;font-size:18px;color:#e8c060;letter-spacing:.1em;text-align:center;margin-bottom:4px;";
    box.appendChild(title);
    wallets.forEach(w=>{
      const btn = document.createElement('button');
      btn.textContent = w.name;
      btn.style.cssText="font-family:'Bloodcrow',serif;font-size:15px;padding:10px 20px;background:linear-gradient(135deg,#0e3a0e,#1a5a1a);color:#70e870;border:1px solid #2a8a2a;border-radius:6px;cursor:pointer;letter-spacing:.08em;";
      btn.onclick=()=>{ document.body.removeChild(overlay); resolve(w.provider); };
      box.appendChild(btn);
    });
    const cancel = document.createElement('button');
    cancel.textContent='Cancel';
    cancel.style.cssText="font-family:'Bloodcrow',serif;font-size:13px;padding:8px;background:transparent;color:#7a6040;border:1px solid #3a2810;border-radius:6px;cursor:pointer;";
    cancel.onclick=()=>{ document.body.removeChild(overlay); resolve(null); };
    box.appendChild(cancel);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
  });
}

async function connectSol(){
  const wallets = detectSolanaWallets();
  if(!wallets.length){
    alert('No Solana wallet found. Please install Phantom, Solflare, or Backpack.');
    hideSyncing();
    return;
  }
  let provider;
  if(wallets.length === 1){ provider = wallets[0].provider; }
  else {
    const choice = await showWalletPicker(wallets);
    if(!choice) return;
    provider = choice;
  }
  try{
    const resp = await provider.connect();
    const pubkey = resp.publicKey.toString();
    window._solanaProvider = provider;
    showWalletConnected(pubkey, 'sol');
    await new Promise(r => setTimeout(r, 50));
    await loadWalletPacks(pubkey);
  } catch(e){ hideSyncing(); console.error('Solana connect error', e); }
}

function doDisconnect(){
  if(window._solanaProvider) try{ window._solanaProvider.disconnect(); }catch(e){}
  if(window._beaconClient)   try{ window._beaconClient.clearActiveAccount(); }catch(e){}
  currentWallet = null; currentPlatform = null;
  packCounts = { common:0, rare:0, legendary:0, ultimate:0 };
  if(typeof window.setHeaderWallet === 'function') window.setHeaderWallet(null, null);
  const solRow = document.getElementById('wps-sol');
  const tezRow = document.getElementById('wps-tez');
  if(solRow){ solRow.classList.remove('connected'); document.getElementById('wps-sol-addr').textContent='Not connected'; solRow.style.display=''; }
  if(tezRow){ tezRow.classList.remove('connected'); document.getElementById('wps-tez-addr').textContent='Not connected'; tezRow.style.display='none'; }
  document.getElementById('pack-list').innerHTML = '<div id="packs-empty-msg">Connect wallet to load packs</div>';
  resetCenter();
}

let _beaconClient = null;
async function getBeaconClient(){
  if(_beaconClient) return _beaconClient;
  _beaconClient = new beacon.DAppClient({ name: 'Hex & Stitch' });
  return _beaconClient;
}

async function connectTez(){
  try{
    const client = await getBeaconClient();
    const acc = await client.requestPermissions();
    const addr = acc.address;
    showWalletConnected(addr, 'tez');
    await new Promise(r => setTimeout(r, 50));
    packCounts = JSON.parse(localStorage.getItem(`${addr}_packInventory`) || '{"common":0,"rare":0,"legendary":0,"ultimate":0}');
    window._packMints = { common:[], rare:[], legendary:[], ultimate:[] };
    renderPackList(packCounts, window._packMints);
    hideSyncing();
  } catch(e){ hideSyncing(); console.error('Tezos connect error', e); }
}

// ── Wallet UI helpers ──────────────────────────────────────────
function showWalletConnected(pubkey, platform){
  currentWallet = pubkey; currentPlatform = platform;
  const short = pubkey.slice(0,4) + '…' + pubkey.slice(-4);
  const isTez = platform === 'tez';
  const solRow = document.getElementById('wps-sol');
  const tezRow = document.getElementById('wps-tez');
  if(isTez){
    tezRow.style.display = ''; tezRow.classList.add('connected');
    document.getElementById('wps-tez-addr').textContent = short;
    solRow.style.display = 'none';
  } else {
    solRow.style.display = ''; solRow.classList.add('connected');
    document.getElementById('wps-sol-addr').textContent = short;
    tezRow.style.display = 'none';
  }
  if(typeof window.setHeaderWallet === 'function') window.setHeaderWallet(pubkey, platform);
  setSyncing('Loading packs…');
  document.getElementById('pack-list').innerHTML =
    '<div class="packs-loading-msg"><div class="pack-spinner"></div>Loading packs…</div>';
}
function setSyncing(msg){
  const el = document.getElementById('wallet-syncing');

  el.style.display = '';
}

// ── Helius / pack loading ──────────────────────────────────────
async function fetchAllAssets(pubkey){
  let all=[], page=1;
  while(true){
    const r = await fetch(HELIUS_URL,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({jsonrpc:'2.0',id:'1',method:'getAssetsByOwner',
        params:{ownerAddress:pubkey,page,limit:1000,displayOptions:{showCollectionMetadata:true}}})});
    const items=(await r.json()).result?.items||[];
    all=all.concat(items);
    if(items.length<1000) break;
    page++;
  }
  return all;
}

async function loadWalletPacks(pubkey){
  try{
    const assets = await fetchAllAssets(pubkey);
    let openedMints = [];
    try{
      const omRes = await fetch(`${WIX_API}/getOpenedMints?wallet=${encodeURIComponent(pubkey)}`);
      if(omRes.ok){ const d = await omRes.json(); openedMints = d.mints||[]; }
      localStorage.setItem(`${pubkey}_openedMints`, JSON.stringify(openedMints));
    } catch(e){
      openedMints = JSON.parse(localStorage.getItem(`${pubkey}_openedMints`)||'[]');
    }

    const unopened = assets.filter(a => {
      if(openedMints.includes(a.id)) return false;
      return (a.grouping||[]).some(g=>g.group_value===PACK_COLLECTION);
    });

    const counts = {common:0,rare:0,legendary:0,ultimate:0};
    window._packMints = {common:[],rare:[],legendary:[],ultimate:[]};
    for(const asset of unopened){
      const attrs = asset.content?.metadata?.attributes||[];
      let rarity = null;
      for(const a of attrs){
        const k=(a.trait_type||'').toLowerCase();
        const v=(a.value||'').toLowerCase();
        if(k==='rarity'||k==='tier'||k==='pack'){
          if(v.includes('ultimate')) rarity='ultimate';
          else if(v.includes('legendary')) rarity='legendary';
          else if(v.includes('rare')) rarity='rare';
          else if(v.includes('common')) rarity='common';
        }
      }
      if(!rarity){
        const name=(asset.content?.metadata?.name||'').toLowerCase();
        if(name.includes('ultimate')) rarity='ultimate';
        else if(name.includes('legendary')) rarity='legendary';
        else if(name.includes('rare')) rarity='rare';
        else rarity='common';
      }
      if(rarity){ counts[rarity]++; window._packMints[rarity].push(asset.id); }
    }
    packCounts = counts;
    renderPackList(packCounts, window._packMints);
    const total = Object.values(counts).reduce((a,b)=>a+b,0);
    setSyncing(total > 0 ? `${total} pack${total>1?'s':''} found` : 'No packs found');
    setTimeout(hideSyncing, 2500);
  } catch(e){
    console.error('loadWalletPacks failed', e);
    hideSyncing();
    document.getElementById('pack-list').innerHTML =
      '<div style="font-size:12px;color:#8a4040;text-align:center;padding:20px 0;letter-spacing:.08em;text-transform:uppercase">Failed to load packs</div>';
  }
}

// ── Pack list render ───────────────────────────────────────────
function renderPackList(counts, mints){
  const list = document.getElementById('pack-list');
  list.innerHTML = '';
  let any = false;
  for(const r of RARITIES){
    if(!counts[r]) continue;
    any = true;
    const entry = document.createElement('div');
    entry.className = 'pack-entry';
    entry.dataset.rarity = r;
    entry.innerHTML = `
      <img src="${PACK_IMGS[r]}" alt="${r}">
      <div class="pack-entry-info">
        <div class="pack-entry-name rarity-${r}">${r} Pack</div>
      </div>
      <div class="pack-entry-badge">${counts[r]}</div>`;
    entry.onclick = () => selectPack(r, mints[r]?.[0]);
    list.appendChild(entry);
  }
  if(!any){
    list.innerHTML = '<div id="packs-empty-msg">No unopened packs</div>';
  }
}

// ── Pack selection ─────────────────────────────────────────────
function selectPack(rarity, mint){
  activePack = { rarity, mint };

  document.querySelectorAll('.pack-entry').forEach(e =>
    e.classList.toggle('active', e.dataset.rarity === rarity)
  );

  document.getElementById('center-idle').style.display   = 'none';
  document.getElementById('center-reveal').style.display = 'none';
  document.getElementById('collect-btn').style.display   = 'none';
  document.getElementById('cards-row').innerHTML = '';
  document.getElementById('tap-hint').style.display = '';

  const cp = document.getElementById('center-pack');
  cp.style.display = 'flex';

  const title = document.getElementById('rarity-title');
  title.textContent = rarity.toUpperCase() + ' PACK';
  title.className = `rarity-${rarity}`;
  setTimeout(() => title.classList.add('visible'), 50);

  document.getElementById('pack-img').src = PACK_IMGS[rarity];
  document.documentElement.style.setProperty('--pack-glow', GLOW_COLORS[rarity]);
  setRoomGlow(rarity);
  buildSmoke(rarity);

  // Mobile: open as overlay
  if(window.innerWidth <= 800){
    const center = document.getElementById('panel-center');
    center.classList.add('mob-open');
    if(!document.getElementById('mob-back-btn')){
      const btn = document.createElement('button');
      btn.id = 'mob-back-btn';
      btn.textContent = '← Back';
      btn.onclick = function(){ center.classList.remove('mob-open'); };
      center.insertBefore(btn, center.firstChild);
    }
    center.scrollTop = 0;
  }
}

// ── Reveal ─────────────────────────────────────────────────────
async function revealCards(){
  document.getElementById('center-reveal').style.display = 'flex';
  const row = document.getElementById('cards-row');
  row.innerHTML = '';

  const { rarity, mint } = activePack;
  try{
    const res = await fetch(`${WIX_API}/openPack`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ wallet:currentWallet, rarity, mintAddress:mint })
    });
    const data = await res.json();
    rolledItems = data.items || [];
  } catch(e){
    console.warn('openPack failed, rolling locally');
    rolledItems = rollPackItems(rarity);
  }

  if(!rolledItems.length){ rolledItems = rollPackItems(rarity); }

  rolledItems.forEach((item, i) => {
    const card = buildCard(item);
    row.appendChild(card);
    setTimeout(() => card.classList.add('appeared'), 200 + i*180);
  });
}

function buildCard(item){
  const name  = item.path.split('/').pop().replace(/\.(png|PNG|jpg|JPG)$/,'').replace(/_/g,' ');
  const cat   = (item.cat||'').split('_')[0];
  const stats = itemStats(item.path);
  const imgSrc = CDN + '/' + item.path;
  const card = document.createElement('div');
  card.className = `reveal-card rarity-${item.rarity||'common'}`;
  card.innerHTML = `
    <div class="reveal-card-inner" onclick="flipCard(this)">
      <div class="card-face card-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="#c8a060" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
      </div>
      <div class="card-face card-front rarity-${item.rarity}">
        <img class="card-item-img" src="${imgSrc}" alt="${name}" onerror="this.style.opacity='.3'">
        <div class="card-item-name">${name}</div>
        <div class="card-item-cat">${cat}</div>
        <div class="card-stats">
          <div class="card-stat curse"><span class="sv">${stats.curse}</span><span class="sl">Curse</span></div>
          <div class="card-stat doom"><span class="sv">${stats.doom}</span><span class="sl">Doom</span></div>
          <div class="card-stat hex"><span class="sv">${stats.hex}</span><span class="sl">Hex</span></div>
        </div>
      </div>
    </div>`;
  return card;
}

function flipCard(inner){
  const card = inner.parentElement;
  if(card.classList.contains('flipped')) return;
  card.classList.add('flipped');
  checkAllFlipped();
}

function checkAllFlipped(){
  const cards   = document.querySelectorAll('.reveal-card');
  const flipped = document.querySelectorAll('.reveal-card.flipped');
  if(cards.length > 0 && cards.length === flipped.length){
    document.getElementById('tap-hint').style.display = 'none';
    document.getElementById('collect-btn').style.display = 'block';
  }
}

// ── Collect ────────────────────────────────────────────────────
function collectPack(){
  const { rarity, mint } = activePack;

  // Save opened mint
  if(mint && currentWallet){
    const key = `${currentWallet}_openedMints`;
    const opened = JSON.parse(localStorage.getItem(key)||'[]');
    if(!opened.includes(mint)) opened.push(mint);
    localStorage.setItem(key, JSON.stringify(opened));
  }

  // Decrement counts + remove mint
  packCounts[rarity] = Math.max(0, (packCounts[rarity]||1) - 1);
  if(window._packMints?.[rarity]?.length) window._packMints[rarity].shift();

  // Log session
  logPackOpen(rarity);

  // Re-render left
  renderPackList(packCounts, window._packMints);

  // Reset center
  resetCenter();
}

function resetCenter(){
  activePack = null;
  document.getElementById('center-reveal').style.display = 'none';
  document.getElementById('center-pack').style.display   = 'none';
  document.getElementById('cards-row').innerHTML = '';
  document.getElementById('collect-btn').style.display = 'none';
  document.getElementById('tap-hint').style.display = '';
  document.querySelectorAll('.pack-entry').forEach(e => e.classList.remove('active'));
  // Mobile: close overlay
  document.getElementById('panel-center').classList.remove('mob-open');

  const allEmpty = RARITIES.every(r => !packCounts[r]);
  const idleEl = document.getElementById('center-idle');
  idleEl.style.display = '';
  idleEl.textContent = allEmpty && currentWallet
    ? 'All packs opened!'
    : 'Select a pack to open';
}

// ── Item stats (deterministic) ─────────────────────────────────
function hashStr(s){
  let h=5381;
  for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0;
  return Math.abs(h);
}
function itemStats(path){
  const filename = path.split('/').pop();
  const rarity   = path.split('/')[1]||'common';
  const h = hashStr(filename);
  const total = RARITY_TOTALS[rarity]||15;
  const a=1+(h%7), b=1+((h>>>4)%7), sum=a+b+(1+((h>>>8)%7));
  const curse=Math.round(total*a/sum), doom=Math.round(total*b/sum);
  return { curse, doom, hex:Math.max(1,total-curse-doom) };
}

function rollOne(rarity, cat){
  const pool = PACK_ITEMS[rarity]?.[cat];
  if(!pool||!pool.length) return null;
  return { path:pool[Math.floor(Math.random()*pool.length)], cat, rarity };
}

function rollPackItems(rarity){
  const cats = ['body','knife','offhand','necklace','eyes'];
  let slots = [];
  if(rarity==='common'){
    slots=[{r:'common'},{r:'common'},{r:'common'},{r:'common'},{r:'common'}];
    if(Math.random()<0.10) slots[Math.floor(Math.random()*5)].r='rare';
  } else if(rarity==='rare'){
    slots=[{r:'rare'},{r:'rare'},{r:'common'}];
    if(Math.random()<0.10){ const i=slots.findIndex(s=>s.r==='rare'); slots[i].r='legendary'; }
  } else if(rarity==='legendary'){
    slots=[{r:'legendary'},{r:'legendary'},{r:'rare'},{r:'common'}];
    if(Math.random()<0.10){ const i=slots.findIndex(s=>s.r==='legendary'); slots[i].r='ultimate'; }
  } else if(rarity==='ultimate'){
    slots=[{r:'ultimate'},{r:'ultimate'},{r:'legendary'},{r:'rare'},{r:'common'}];
  }
  const shuffled=[...cats].sort(()=>Math.random()-.5);
  return slots.map((slot,i)=>{
    const cat=shuffled[i%shuffled.length];
    return rollOne(slot.r,cat)||rollOne('common',cat);
  }).filter(Boolean);
}

// ── Auto-connect from sessionStorage ──────────────────────────
setTimeout(async function autoConnect(){

  const key      = sessionStorage.getItem('wallet_key');
  const platform = sessionStorage.getItem('wallet_platform');
  if(!key) return;
  showWalletConnected(key, platform || 'sol');
  await new Promise(r => setTimeout(r, 50));
  if(platform === 'tez'){
    packCounts = JSON.parse(localStorage.getItem(`${key}_packInventory`) || '{"common":0,"rare":0,"legendary":0,"ultimate":0}');
    window._packMints = { common:[], rare:[], legendary:[], ultimate:[] };
    renderPackList(packCounts, window._packMints);
    hideSyncing();
  } else {
    await loadWalletPacks(key);
  }
}, 0);
